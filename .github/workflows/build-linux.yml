name: Build Linux App
on: 
  workflow_dispatch: # Allows you to run this manually from the GitHub UI

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install Linux Dependencies
        # Wails v3 defaults to the GTK4 / WebKitGTK 6.0 backend on Linux.
        run: sudo apt-get update && sudo apt-get install -y gcc libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Install Wails v3
        run: go install -v github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.103

      - name: Build Application
        run: wails3 task build PLATFORM=linux CONFIG=production

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: bin/ # Adjust this if your Taskfile outputs to a different folder