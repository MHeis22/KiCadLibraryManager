name: Package Cross-Platform App
on: 
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false # Prevents one OS failure from instantly canceling the others
      matrix:
        include:
          # Linux: build the binary only. Full multi-format packaging
          # (AppImage/deb/rpm/aur) is fragile on generic CI runners.
          - os: ubuntu-latest
            platform: linux
            artifact: linux-binary
            task: build
          - os: macos-latest
            platform: darwin
            artifact: mac-package
            task: package
          - os: windows-latest
            platform: windows
            artifact: windows-package
            task: package

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history (fetches all tags and prevents git exit-128)

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod' # Match the toolchain go.mod requires (1.25), not a stale pin
          cache: false # Bypasses the tar exit code 2 cache corruption issue

      # Linux only: Install GTK/Webkit dependencies
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails v3
        # Must match the wails/v3 version in go.mod, or `generate bindings` fails
        # (e.g. "could not import C (no metadata for C)" on cgo platforms).
        run: go install -v github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.103

      - name: Build / Package Application
        run: wails3 task ${{ matrix.task }} PLATFORM=${{ matrix.platform }} CONFIG=production

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/