name: Package Cross-Platform App
on: 
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false # Prevents one OS failure from instantly canceling the others
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: linux-package
            task: package
          - os: macos-latest
            platform: darwin
            artifact: mac-package
            task: package
          - os: windows-latest
            platform: windows
            artifact: windows-package
            task: package

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history (fetches all tags and prevents git exit-128)

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod' # Match the toolchain go.mod requires (1.25), not a stale pin
          cache: false # Bypasses the tar exit code 2 cache corruption issue

      # Linux only: Wails v3 defaults to the GTK4 / WebKitGTK 6.0 backend,
      # so install the GTK4 dev stack (not gtk3/webkit2gtk-4.1).
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Install Wails v3
        # Must match the wails/v3 version in go.mod, or `generate bindings` fails
        # (e.g. "could not import C (no metadata for C)" on cgo platforms).
        run: go install -v github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.103

      # Windows only: Install NSIS (makensis) for packaging installers
      - name: Install NSIS
        if: runner.os == 'Windows'
        uses: negrutiu/nsis-install@v1


      - name: Build / Package Application
        env:
          # Let the appimagetool AppImage self-extract instead of needing FUSE,
          # which isn't available on the GitHub runners.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: wails3 task ${{ matrix.task }} PLATFORM=${{ matrix.platform }} CONFIG=production

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/